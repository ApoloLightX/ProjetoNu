name: Finalize ATLAS demo README

on:
  push:
    branches: [chore/real-demo-capture]
    paths:
      - .github/workflows/finalize-demo-readme.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify real media exists
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/demo.gif
          test -s assets/demo.mp4
          test "$(stat -c%s assets/demo.gif)" -lt 10485760
          test "$(stat -c%s assets/demo.mp4)" -lt 52428800

      - name: Wire real media into README
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          old_media = '''<!-- README_DEMO_MEDIA_START
          <p align="center">
            <img src="assets/demo.gif" alt="ATLAS SAC and ATLAS Micro real product demo" width="100%" />
          </p>
          <p align="center">
            <a href="REPLACE_WITH_FINAL_DEMO_VIDEO_URL"><strong>Watch the 60–90 second product demo</strong></a>
          </p>
          README_DEMO_MEDIA_END -->'''

          new_media = '''<p align="center">
            <img src="assets/demo.gif" alt="ATLAS SAC and ATLAS Micro real product demo" width="100%" />
          </p>
          <p align="center">
            <a href="assets/demo.mp4"><strong>Watch the full real product demo</strong></a>
            ·
            <a href="https://atlas-sac-ui.vercel.app"><strong>Open ATLAS SAC</strong></a>
            ·
            <a href="https://atlas-sac-ui.vercel.app/micro"><strong>Open ATLAS Micro</strong></a>
          </p>
          <p align="center"><sub>Real deployed-product capture. No AI-generated product screenshots.</sub></p>'''

          if old_media not in text:
              raise SystemExit("README media placeholder not found")
          text = text.replace(old_media, new_media, 1)

          old_proof = "The repository does **not** include AI-generated fake product screenshots as proof of functionality. The final GIF/video should be captured from the real deployed interface."
          new_proof = "The repository uses **real captured product media recorded from the deployed interface**. No AI-generated fake product screenshots are used as proof of functionality."
          if old_proof not in text:
              raise SystemExit("README proof sentence not found")
          text = text.replace(old_proof, new_proof, 1)

          old_publish = '''<!--
          Publishing the real media requires only two changes after capture:
          1. add assets/demo.gif;
          2. replace REPLACE_WITH_FINAL_DEMO_VIDEO_URL and uncomment README_DEMO_MEDIA_START/END at the top.
          -->
          '''
          text = text.replace(old_publish, "")

          old_assets = '''│   ├── atlas-hero.svg
          │   ├── architecture.svg
          │   └── evidence-flow.svg'''
          new_assets = '''│   ├── atlas-hero.svg
          │   ├── architecture.svg
          │   ├── evidence-flow.svg
          │   ├── demo.gif                      # real deployed-product loop
          │   └── demo.mp4                      # full real product demo'''
          if old_assets not in text:
              raise SystemExit("README asset map not found")
          text = text.replace(old_assets, new_assets, 1)

          path.write_text(text, encoding="utf-8")

      - name: Remove one-off capture automation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/capture-demo.yml
          git rm .github/workflows/capture-demo-fixed.yml
          git rm scripts/capture-demo.mjs
          git rm .github/workflows/finalize-demo-readme.yml

      - name: Commit final portfolio media wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Publish real ATLAS product demo media"
          git push

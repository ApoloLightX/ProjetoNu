name: Portfolio heartbeat

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify API and Supabase readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            curl \
              --fail \
              --show-error \
              --silent \
              --retry 2 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              https://atlas-sac-api.vercel.app/health
            echo
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done

      - name: Warm deterministic ML path
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 45 \
            https://atlas-sac-api.vercel.app/v1/ml/evaluation \
            > /dev/null

      - name: Verify public web entry points
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            https://atlas-sac-ui.vercel.app \
            > /dev/null
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            https://atlas-sac-ui.vercel.app/micro \
            > /dev/null

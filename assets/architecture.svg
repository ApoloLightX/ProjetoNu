<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ATLAS architecture</title>
  <desc id="desc">Architecture diagram for ATLAS SAC and ATLAS Micro showing frontend, FastAPI, evidence boundaries, models, human review, persistence and production-readiness controls.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777f78"/>
    </marker>
  </defs>
  <rect width="1400" height="900" rx="24" fill="#0d0f0e"/>
  <rect x="1" y="1" width="1398" height="898" rx="23" fill="none" stroke="#2b302c"/>

  <text x="64" y="62" fill="#f2f0e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="650">ATLAS architecture</text>
  <text x="64" y="88" fill="#aaa89f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Two product lenses, one evidence discipline</text>

  <rect x="64" y="124" width="1272" height="108" rx="14" fill="#141715" stroke="#2b302c"/>
  <text x="88" y="153" fill="#8c9aa4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">BROWSER · NEXT.JS / TYPESCRIPT</text>
  <rect x="88" y="170" width="570" height="42" rx="8" fill="#182019" stroke="#374037"/>
  <text x="110" y="196" fill="#f2f0e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">ATLAS SAC</text>
  <text x="214" y="196" fill="#aaa89f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">CNPJ context · risk workstation · Evidence Trace</text>
  <rect x="678" y="170" width="634" height="42" rx="8" fill="#211d15" stroke="#463d28"/>
  <text x="700" y="196" fill="#f2f0e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">ATLAS MICRO</text>
  <text x="819" y="196" fill="#aaa89f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Evidence Passport · coverage · unknowns · descriptive metrics</text>

  <line x1="700" y1="232" x2="700" y2="275" stroke="#777f78" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="282" width="320" height="54" rx="10" fill="#181a19" stroke="#947b90"/>
  <text x="700" y="305" fill="#947b90" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">FASTAPI RISK ENGINE</text>
  <text x="700" y="324" fill="#f2f0e9" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">validation · orchestration · versioned contracts</text>

  <line x1="540" y1="309" x2="386" y2="309" stroke="#777f78" stroke-width="2"/>
  <line x1="386" y1="309" x2="386" y2="374" stroke="#777f78" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="309" x2="1014" y2="309" stroke="#777f78" stroke-width="2"/>
  <line x1="1014" y1="309" x2="1014" y2="374" stroke="#777f78" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="64" y="382" width="622" height="334" rx="16" fill="#121613" stroke="#374037"/>
  <text x="90" y="414" fill="#93aa8d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ATLAS SAC PIPELINE</text>

  <rect x="90" y="438" width="570" height="46" rx="8" fill="#171a18" stroke="#2b302c"/>
  <text x="110" y="457" fill="#f2f0e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Public registry context</text>
  <text x="110" y="475" fill="#8c9aa4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">identity · CNAE · location · provenance</text>
  <rect x="504" y="449" width="136" height="24" rx="12" fill="#1c2327" stroke="#354047"/>
  <text x="572" y="465" fill="#aab5bc" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">risk_signal=false</text>

  <line x1="375" y1="484" x2="375" y2="509" stroke="#777f78" marker-end="url(#arrow)"/>
  <rect x="90" y="516" width="270" height="64" rx="8" fill="#171a18" stroke="#2b302c"/>
  <text x="110" y="540" fill="#f2f0e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Deterministic rules</text>
  <text x="110" y="560" fill="#aaa89f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">inherent ≠ observed</text>
  <rect x="390" y="516" width="270" height="64" rx="8" fill="#171a18" stroke="#2b302c"/>
  <text x="410" y="540" fill="#f2f0e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Synthetic ML baseline</text>
  <text x="410" y="560" fill="#aaa89f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Logistic Regression · holdout metrics</text>

  <line x1="225" y1="580" x2="225" y2="606" stroke="#777f78" marker-end="url(#arrow)"/>
  <line x1="525" y1="580" x2="525" y2="606" stroke="#777f78" marker-end="url(#arrow)"/>
  <rect x="90" y="613" width="570" height="46" rx="8" fill="#1a171a" stroke="#4a3948"/>
  <text x="110" y="641" fill="#f2f0e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Evidence Trace → Gemini analyst → Groq independent challenge</text>

  <line x1="375" y1="659" x2="375" y2="681" stroke="#777f78" marker-end="url(#arrow)"/>
  <rect x="182" y="687" width="386" height="42" rx="8" fill="#241d23" stroke="#947b90"/>
  <text x="375" y="713" fill="#f2f0e9" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Human-review gate · AI cannot lower it</text>

  <rect x="714" y="382" width="622" height="334" rx="16" fill="#171510" stroke="#463d28"/>
  <text x="740" y="414" fill="#c9b98d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ATLAS MICRO PIPELINE</text>

  <rect x="740" y="438" width="570" height="54" rx="8" fill="#1b1913" stroke="#3c3625"/>
  <text x="760" y="460" fill="#f2f0e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Synthetic-only evidence packet</text>
  <text x="760" y="480" fill="#aaa89f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">3–24 monthly observations · optional concentration · debt service</text>

  <line x1="1025" y1="492" x2="1025" y2="516" stroke="#777f78" marker-end="url(#arrow)"/>
  <rect x="740" y="523" width="270" height="66" rx="8" fill="#1b1913" stroke="#3c3625"/>
  <text x="760" y="547" fill="#f2f0e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Evidence availability</text>
  <text x="760" y="568" fill="#aaa89f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">available · partial · unknown</text>
  <rect x="1040" y="523" width="270" height="66" rx="8" fill="#1b1913" stroke="#3c3625"/>
  <text x="1060" y="547" fill="#f2f0e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Descriptive metrics</text>
  <text x="1060" y="568" fill="#aaa89f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">cash flow · variation · concentration</text>

  <line x1="1025" y1="589" x2="1025" y2="613" stroke="#777f78" marker-end="url(#arrow)"/>
  <rect x="740" y="620" width="570" height="52" rx="8" fill="#211d15" stroke="#c9b98d"/>
  <text x="760" y="642" fill="#f2f0e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Evidence Passport</text>
  <text x="760" y="661" fill="#c9b98d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">missing information ≠ adverse evidence</text>

  <rect x="837" y="686" width="376" height="42" rx="8" fill="#211d15" stroke="#c9b98d"/>
  <text x="1025" y="712" fill="#f2f0e9" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">credit_decision_produced = false</text>

  <line x1="375" y1="729" x2="375" y2="758" stroke="#777f78"/>
  <line x1="1025" y1="729" x2="1025" y2="758" stroke="#777f78"/>
  <line x1="375" y1="758" x2="1025" y2="758" stroke="#777f78"/>
  <line x1="700" y1="758" x2="700" y2="782" stroke="#777f78" marker-end="url(#arrow)"/>

  <rect x="442" y="790" width="516" height="58" rx="11" fill="#141715" stroke="#2b302c"/>
  <text x="700" y="814" fill="#8c9aa4" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">SHARED PRODUCTION READINESS</text>
  <text x="700" y="836" fill="#f2f0e9" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">timeouts · bounded retry · request IDs · telemetry · CI · security boundaries</text>

  <text x="64" y="876" fill="#777f78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Persistence: Supabase/PostgreSQL stores immutable SAC snapshots, evidence, AI traces and separate human reviews. Managed infrastructure is preferred until measured scale justifies additional complexity.</text>
</svg>
